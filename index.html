<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Landing Page</title>

    <!-- roboto font -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet" />

    <!-- my css -->
    <link
      rel="stylesheet"
      href="styles.css" />
  </head>

  <body>
    <div class="header bg-dark">
      <div class="container">
        <div class="header-contents">
          <div class="header-logo">
            <span class="odin-logo-text">Header Logo</span>
          </div>

          <div class="header-links">
            <ul class="odin-header-links">
              <li>
                <a href="#">Link 1</a>
              </li>
              <li>
                <a href="#">Link 2</a>
              </li>
              <li>
                <a href="#">Link 3</a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
    <!-- header -->

    <section class="hero bg-dark">
      <div class="container">
        <div class="hero-contents">
          <div class="hero-content-left">
            <h1 class="odin-hero-main-text">This website is awesome</h1>
            <p class="odin-hero-secondary-text">
              This website has some subtext that goes under the <br />
              main title. It's a smaller font and the color is lower contrast.
            </p>
            <a
              href="#"
              class="odin-button">
              Sign up
            </a>
          </div>

          <div class="hero-content-right">
            <img
              class="hero-image"
              src="./image.jpg"
              alt="Hero Image" />
          </div>
        </div>
      </div>
    </section>
    <!-- hero -->
  </body>
</html>
